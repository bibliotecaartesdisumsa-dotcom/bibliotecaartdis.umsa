{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .pdf-container {
        height: calc(100vh - 120px);
        background: #1a1a2e;
        padding: 0;
        margin: -1.5rem -1.5rem 0 -1.5rem;
    }
    .pdf-iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
    .pdf-header {
        background: var(--primary-dark);
        padding: 1rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .pdf-header h4 {
        color: white;
        margin: 0;
    }
    .btn-back {
        background: var(--accent);
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        text-decoration: none;
    }
</style>

<div class="pdf-container">
    <div class="pdf-header">
        <h4><i class="fas fa-book-open"></i> {{ libro.titulo }}</h4>
        <a href="javascript:history.back()" class="btn-back">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
    </div>
    
    {% if archivo_url %}
        <iframe class="pdf-iframe" src="{{ archivo_url }}" allow="fullscreen"></iframe>
    {% else %}
        <div style="display: flex; justify-content: center; align-items: center; height: 80%;">
            <div class="text-center text-white">
                <i class="fas fa-lock fa-4x mb-3"></i>
                <h3>Acceso Restringido</h3>
                <p>{{ mensaje|default:"Este documento no está disponible para lectura en línea." }}</p>
            </div>
        </div>
    {% endif %}
</div>
{% endblock %}
